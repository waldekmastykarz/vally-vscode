name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Check release prerequisites
        env:
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          if (process.env.GITHUB_REF_NAME !== `v${version}`) {
            throw new Error(`Tag must match package version v${version}`);
          }
          if (process.env.REPOSITORY_PRIVATE !== 'false') {
            throw new Error('npm provenance requires a public source repository');
          }
          NODE

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm publish --access public --provenance
